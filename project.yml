name: CineLog13Pro
options:
  bundleIdPrefix: com.cinelog13pro
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    ENABLE_BITCODE: NO
targets:
  CineLog13Pro:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cinelog13pro.camera
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "2"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "CineLog 13 Pro"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: "APPL"
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "2"
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
          - metal
          - video-camera
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "需要使用相机以采集 4:3 Open Gate 与 10-bit Apple Log 视频"
        NSMicrophoneUsageDescription: "需要使用麦克风以录制同步音频"
        NSPhotoLibraryAddUsageDescription: "需要访问相册以保存录制的 ProRes / HEVC Log 视频与后期调色成片"
        NSPhotoLibraryUsageDescription: "需要访问相册以导入视频至后期调色室 (Post Color Grading Studio)"
