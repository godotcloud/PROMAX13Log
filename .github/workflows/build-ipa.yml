name: Build CineLog13Pro iOS IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    name: Compile 10-Bit Apple Log Camera IPA (macOS / Xcode)
    runs-on: macos-15

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Organize Swift Sources & Auto-Generate XcodeGen Configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Sources

          # 自动查找仓库根目录或子目录中的 .swift 源码并放入 Sources/
          find . -maxdepth 2 -name "*.swift" -not -path "./Sources/*" -exec cp {} Sources/ \;

          if [ -z "$(ls -A Sources/*.swift 2>/dev/null)" ]; then
            echo "Error: No .swift source files found in repository!"
            exit 1
          fi

          echo "Found Swift sources:"
          ls -la Sources/

          # 若仓库根目录没有 project.yml，自动生成 project.yml 与 Info.plist
          if [ ! -f "project.yml" ]; then
            cat << 'EOF' > project.yml
          name: CineLog13Pro
          options:
            bundleIdPrefix: com.cinelog13pro
            deploymentTarget:
              iOS: "16.0"
          settings:
            base:
              SWIFT_VERSION: "5.0"
              IPHONEOS_DEPLOYMENT_TARGET: "16.0"
              TARGETED_DEVICE_FAMILY: "1"
              CODE_SIGN_IDENTITY: ""
              CODE_SIGNING_REQUIRED: NO
              CODE_SIGNING_ALLOWED: NO
              ENABLE_BITCODE: NO
          targets:
            CineLog13Pro:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: Sources
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.cinelog13pro.camera
                  INFOPLIST_FILE: Info.plist
                  GENERATE_INFOPLIST_FILE: NO
                  MARKETING_VERSION: "1.0.0"
                  CURRENT_PROJECT_VERSION: "1"
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: "CineLog 13 Pro"
                  CFBundleExecutable: "$(EXECUTABLE_NAME)"
                  CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
                  CFBundleName: "$(PRODUCT_NAME)"
                  CFBundlePackageType: "APPL"
                  CFBundleShortVersionString: "1.0.0"
                  CFBundleVersion: "1"
                  LSRequiresIPhoneOS: true
                  UIApplicationSceneManifest:
                    UIApplicationSupportsMultipleScenes: false
                  UILaunchScreen: {}
                  UIRequiredDeviceCapabilities:
                    - arm64
                    - metal
                    - video-camera
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  NSCameraUsageDescription: "需要使用相机以采集 10-bit Apple Log 视频"
                  NSMicrophoneUsageDescription: "需要使用麦克风以录制同步音频"
                  NSPhotoLibraryAddUsageDescription: "需要访问相册以保存录制的 ProRes / HEVC Log 视频"
                  NSPhotoLibraryUsageDescription: "需要访问相册以管理录制的 ProRes / HEVC Log 视频"
          EOF
          fi

      - name: 3. Generate Xcode Project via XcodeGen
        shell: bash
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: 4. Build Release .app with xcodebuild (Unsigned / Sideload Ready)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild clean build \
            -project CineLog13Pro.xcodeproj \
            -scheme CineLog13Pro \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: 5. Ad-Hoc Pseudo-Sign & Package .ipa
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "CineLog13Pro.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: CineLog13Pro.app was not produced!"
            exit 1
          fi

          # 进行 Ad-Hoc 伪签名，支持 AltStore / SideStore / Sideloadly / TrollStore 直接安装
          codesign --force --deep --sign - "$APP_PATH"

          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r9 "../../CineLog13Pro-iPhone13ProMax.ipa" Payload
          cd ../..
          ls -lh CineLog13Pro-iPhone13ProMax.ipa

      - name: 6. Upload Compiled IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineLog13Pro-iPhone13ProMax-IPA
          path: CineLog13Pro-iPhone13ProMax.ipa
          if-no-files-found: error
          retention-days: 30
